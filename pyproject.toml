[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-platform"
version = "0.1.0"
description = "AI Support Bot Platform - multi-platform customer support automation"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4",
    "anthropic>=0.34",
    "openai>=1.40",        # OpenAI SDK - used for xAI Grok (OpenAI-compatible API)
    "pydantic-settings>=2.4",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_platform"]

# --- Ruff -----------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["support_platform"]

[tool.ruff.format]
quote-style = "single"

# --- mypy -----------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]

# --- pytest ---------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
